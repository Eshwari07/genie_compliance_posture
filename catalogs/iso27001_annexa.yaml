# =============================================================================
# iso27001_annexa.yaml — ISO/IEC 27001:2022 Annex A
# =============================================================================
# LICENSING: ISO/IEC 27001 is a copyrighted standard. This file contains NO verbatim
# text from it. `ref` and `title` are the publicly-referenced control identifiers and
# short names used throughout the industry; `text` is independently authored plain-English
# paraphrase written for this project. Loaded with text_provenance = 'paraphrased'.
#
# `uc` is the ground-truth unified control. The LLM crosswalk in notebook 06 never sees
# it; notebook 08 scores the LLM against it.
#
# 93 controls across the four Annex A themes.
# =============================================================================

framework:
  id: ISO27001
  short_name: ISO 27001
  full_name: ISO/IEC 27001:2022 — Information security management systems (Annex A controls)
  version: "2022"
  issuing_body: International Organization for Standardization
  category: Certifiable management system standard
  jurisdiction: International
  text_provenance: paraphrased

obligations:

  # --- A.5 Organizational controls (37) ------------------------------------
  - ref: A.5.1
    title: Policies for information security
    domain: GOV
    uc: UC-GOV-01
    criticality: High
    text: Information security policies must be defined, approved by management, published, communicated to relevant personnel, and reviewed at planned intervals or upon significant change.

  - ref: A.5.2
    title: Information security roles and responsibilities
    domain: GOV
    uc: UC-GOV-02
    criticality: High
    text: Information security responsibilities must be defined and allocated according to organizational needs.

  - ref: A.5.3
    title: Segregation of duties
    domain: IAM
    uc: UC-IAM-04
    criticality: High
    text: Conflicting duties and areas of responsibility must be segregated to reduce the opportunity for unauthorized or unintentional modification or misuse of assets.

  - ref: A.5.4
    title: Management responsibilities
    domain: GOV
    uc: UC-GOV-02
    criticality: Medium
    text: Management must require all personnel to apply information security in accordance with established policies, topic-specific policies and procedures.

  - ref: A.5.5
    title: Contact with authorities
    domain: IRP
    uc: UC-IRP-03
    criticality: Medium
    text: The organization must establish and maintain contact with relevant authorities.

  - ref: A.5.6
    title: Contact with special interest groups
    domain: LOG
    uc: UC-LOG-04
    criticality: Low
    text: The organization must establish and maintain contact with special interest groups, security forums and professional associations.

  - ref: A.5.7
    title: Threat intelligence
    domain: LOG
    uc: UC-LOG-04
    criticality: Medium
    text: Information relating to information security threats must be collected and analysed to produce actionable threat intelligence.

  - ref: A.5.8
    title: Information security in project management
    domain: APP
    uc: UC-APP-01
    criticality: Medium
    text: Information security must be integrated into project management activities.

  - ref: A.5.9
    title: Inventory of information and other associated assets
    domain: ASM
    uc: UC-ASM-01
    criticality: High
    text: An inventory of information and other associated assets, including owners, must be developed and maintained.

  - ref: A.5.10
    title: Acceptable use of information and other associated assets
    domain: HRS
    uc: UC-HRS-05
    criticality: Medium
    text: Rules for the acceptable use and handling of information and associated assets must be identified, documented and implemented.

  - ref: A.5.11
    title: Return of assets
    domain: HRS
    uc: UC-HRS-05
    criticality: Medium
    text: Personnel and other interested parties must return all organizational assets in their possession upon change or termination of their employment, contract or agreement.

  - ref: A.5.12
    title: Classification of information
    domain: DAT
    uc: UC-DAT-01
    criticality: High
    text: Information must be classified according to the organization's information security needs, based on confidentiality, integrity, availability and relevant interested party requirements.

  - ref: A.5.13
    title: Labelling of information
    domain: DAT
    uc: UC-DAT-01
    criticality: Medium
    text: An appropriate set of procedures for information labelling must be developed and implemented in accordance with the classification scheme.

  - ref: A.5.14
    title: Information transfer
    domain: DAT
    uc: UC-DAT-03
    criticality: High
    text: Information transfer rules, procedures and agreements must be in place for all types of transfer facilities within the organization and with external parties.

  - ref: A.5.15
    title: Access control
    domain: IAM
    uc: UC-IAM-04
    criticality: High
    text: Rules to control physical and logical access to information and associated assets must be established and implemented based on business and information security requirements.

  - ref: A.5.16
    title: Identity management
    domain: IAM
    uc: UC-IAM-01
    criticality: High
    text: The full lifecycle of identities must be managed.

  - ref: A.5.17
    title: Authentication information
    domain: IAM
    uc: UC-IAM-02
    criticality: High
    text: Allocation and management of authentication information must be controlled by a management process, including advising personnel on appropriate handling.

  - ref: A.5.18
    title: Access rights
    domain: IAM
    uc: UC-IAM-05
    criticality: High
    text: Access rights to information and associated assets must be provisioned, reviewed, modified and removed in accordance with the organization's access control policy.

  - ref: A.5.19
    title: Information security in supplier relationships
    domain: TPR
    uc: UC-TPR-01
    criticality: High
    text: Processes and procedures must be defined and implemented to manage the information security risks associated with the use of supplier products or services.

  - ref: A.5.20
    title: Addressing information security within supplier agreements
    domain: TPR
    uc: UC-TPR-02
    criticality: High
    text: Relevant information security requirements must be established and agreed with each supplier based on the type of supplier relationship.

  - ref: A.5.21
    title: Managing information security in the ICT supply chain
    domain: APP
    uc: UC-APP-03
    criticality: High
    text: Processes and procedures must be defined and implemented to manage the information security risks associated with the ICT products and services supply chain.

  - ref: A.5.22
    title: Monitoring, review and change management of supplier services
    domain: TPR
    uc: UC-TPR-03
    criticality: Medium
    text: The organization must regularly monitor, review, evaluate and manage change in supplier information security practices and service delivery.

  - ref: A.5.23
    title: Information security for use of cloud services
    domain: TPR
    uc: UC-TPR-01
    criticality: High
    text: Processes for acquisition, use, management and exit from cloud services must be established in accordance with the organization's information security requirements.

  - ref: A.5.24
    title: Information security incident management planning and preparation
    domain: IRP
    uc: UC-IRP-01
    criticality: High
    text: The organization must plan and prepare for managing information security incidents by defining, establishing and communicating incident management processes, roles and responsibilities.

  - ref: A.5.25
    title: Assessment and decision on information security events
    domain: IRP
    uc: UC-IRP-01
    criticality: Medium
    text: The organization must assess information security events and decide whether they are to be categorized as information security incidents.

  - ref: A.5.26
    title: Response to information security incidents
    domain: IRP
    uc: UC-IRP-01
    criticality: High
    text: Information security incidents must be responded to in accordance with the documented procedures.

  - ref: A.5.27
    title: Learning from information security incidents
    domain: IRP
    uc: UC-IRP-02
    criticality: Medium
    text: Knowledge gained from information security incidents must be used to strengthen and improve information security controls.

  - ref: A.5.28
    title: Collection of evidence
    domain: IRP
    uc: UC-IRP-04
    criticality: Medium
    text: The organization must establish and implement procedures for the identification, collection, acquisition and preservation of evidence related to information security events.

  - ref: A.5.29
    title: Information security during disruption
    domain: BCR
    uc: UC-BCR-01
    criticality: High
    text: The organization must plan how to maintain information security at an appropriate level during disruption.

  - ref: A.5.30
    title: ICT readiness for business continuity
    domain: BCR
    uc: UC-BCR-04
    criticality: High
    text: ICT readiness must be planned, implemented, maintained and tested based on business continuity objectives and ICT continuity requirements.

  - ref: A.5.31
    title: Legal, statutory, regulatory and contractual requirements
    domain: GOV
    uc: UC-GOV-04
    criticality: High
    text: Legal, statutory, regulatory and contractual requirements relevant to information security, and the organization's approach to meeting them, must be identified, documented and kept current.

  - ref: A.5.32
    title: Intellectual property rights
    domain: GOV
    uc: UC-GOV-04
    criticality: Low
    text: The organization must implement appropriate procedures to protect intellectual property rights.

  - ref: A.5.33
    title: Protection of records
    domain: DAT
    uc: UC-DAT-06
    criticality: Medium
    text: Records must be protected from loss, destruction, falsification, unauthorized access and unauthorized release.

  - ref: A.5.34
    title: Privacy and protection of personal identifiable information
    domain: DAT
    uc: UC-DAT-01
    criticality: High
    text: The organization must identify and meet the requirements regarding the preservation of privacy and protection of personally identifiable information according to applicable law and contractual requirements.

  - ref: A.5.35
    title: Independent review of information security
    domain: GOV
    uc: UC-GOV-05
    criticality: Medium
    text: The organization's approach to managing information security and its implementation must be reviewed independently at planned intervals or when significant changes occur.

  - ref: A.5.36
    title: Compliance with policies, rules and standards for information security
    domain: GOV
    uc: UC-GOV-05
    criticality: Medium
    text: Compliance with the organization's information security policy, topic-specific policies, rules and standards must be regularly reviewed.

  - ref: A.5.37
    title: Documented operating procedures
    domain: CFG
    uc: UC-CFG-02
    criticality: Medium
    text: Operating procedures for information processing facilities must be documented and made available to personnel who need them.

  # --- A.6 People controls (8) ---------------------------------------------
  - ref: A.6.1
    title: Screening
    domain: HRS
    uc: UC-HRS-01
    criticality: High
    text: Background verification checks on all candidates for employment must be carried out prior to joining and on an ongoing basis, proportionate to business requirements, classification of information accessed and perceived risks.

  - ref: A.6.2
    title: Terms and conditions of employment
    domain: HRS
    uc: UC-HRS-05
    criticality: Medium
    text: Employment contractual agreements must state the personnel's and the organization's responsibilities for information security.

  - ref: A.6.3
    title: Information security awareness, education and training
    domain: HRS
    uc: UC-HRS-02
    criticality: High
    text: Personnel and relevant interested parties must receive appropriate information security awareness, education and training, plus regular updates of organizational policies relevant to their role.

  - ref: A.6.4
    title: Disciplinary process
    domain: HRS
    uc: UC-HRS-05
    criticality: Medium
    text: A disciplinary process must be formalized and communicated to take actions against personnel and other relevant interested parties who have committed an information security policy violation.

  - ref: A.6.5
    title: Responsibilities after termination or change of employment
    domain: HRS
    uc: UC-IAM-01
    criticality: High
    text: Information security responsibilities and duties that remain valid after termination or change of employment must be defined, enforced and communicated.

  - ref: A.6.6
    title: Confidentiality or non-disclosure agreements
    domain: TPR
    uc: UC-TPR-02
    criticality: Medium
    text: Confidentiality or non-disclosure agreements reflecting the organization's needs for the protection of information must be identified, documented, regularly reviewed and signed.

  - ref: A.6.7
    title: Remote working
    domain: IAM
    uc: UC-IAM-07
    criticality: High
    text: Security measures must be implemented when personnel are working remotely to protect information accessed, processed or stored outside the organization's premises.

  - ref: A.6.8
    title: Information security event reporting
    domain: IRP
    uc: UC-IRP-01
    criticality: Medium
    text: The organization must provide a mechanism for personnel to report observed or suspected information security events through appropriate channels in a timely manner.

  # --- A.7 Physical controls (14) ------------------------------------------
  - ref: A.7.1
    title: Physical security perimeters
    domain: PHY
    uc: UC-PHY-01
    criticality: Medium
    text: Security perimeters must be defined and used to protect areas that contain information and other associated assets.

  - ref: A.7.2
    title: Physical entry
    domain: PHY
    uc: UC-PHY-01
    criticality: High
    text: Secure areas must be protected by appropriate entry controls and access points.

  - ref: A.7.3
    title: Securing offices, rooms and facilities
    domain: PHY
    uc: UC-PHY-02
    criticality: Medium
    text: Physical security for offices, rooms and facilities must be designed and implemented.

  - ref: A.7.4
    title: Physical security monitoring
    domain: PHY
    uc: UC-PHY-02
    criticality: Medium
    text: Premises must be continuously monitored for unauthorized physical access.

  - ref: A.7.5
    title: Protecting against physical and environmental threats
    domain: PHY
    uc: UC-PHY-03
    criticality: Medium
    text: Protection against physical and environmental threats, such as natural disasters and other intentional or unintentional physical threats to infrastructure, must be designed and implemented.

  - ref: A.7.6
    title: Working in secure areas
    domain: PHY
    uc: UC-PHY-02
    criticality: Low
    text: Security measures for working in secure areas must be designed and implemented.

  - ref: A.7.7
    title: Clear desk and clear screen
    domain: PHY
    uc: UC-PHY-02
    criticality: Low
    text: Clear desk rules for papers and removable storage media, and clear screen rules for information processing facilities, must be defined and appropriately enforced.

  - ref: A.7.8
    title: Equipment siting and protection
    domain: PHY
    uc: UC-PHY-03
    criticality: Medium
    text: Equipment must be sited securely and protected.

  - ref: A.7.9
    title: Security of assets off-premises
    domain: MED
    uc: UC-MED-03
    criticality: Medium
    text: Off-site assets must be protected.

  - ref: A.7.10
    title: Storage media
    domain: MED
    uc: UC-MED-02
    criticality: High
    text: Storage media must be managed through their lifecycle of acquisition, use, transportation and disposal in accordance with the organization's classification scheme and handling requirements.

  - ref: A.7.11
    title: Supporting utilities
    domain: PHY
    uc: UC-PHY-03
    criticality: Medium
    text: Information processing facilities must be protected from power failures and other disruptions caused by failures in supporting utilities.

  - ref: A.7.12
    title: Cabling security
    domain: PHY
    uc: UC-PHY-03
    criticality: Low
    text: Cables carrying power, data or supporting information services must be protected from interception, interference or damage.

  - ref: A.7.13
    title: Equipment maintenance
    domain: PHY
    uc: UC-PHY-03
    criticality: Low
    text: Equipment must be maintained correctly to ensure availability, integrity and confidentiality of information.

  - ref: A.7.14
    title: Secure disposal or re-use of equipment
    domain: MED
    uc: UC-MED-01
    criticality: High
    text: Items of equipment containing storage media must be verified to ensure that any sensitive data and licensed software has been removed or securely overwritten prior to disposal or re-use.

  # --- A.8 Technological controls (34) -------------------------------------
  - ref: A.8.1
    title: User endpoint devices
    domain: DAT
    uc: UC-DAT-02
    criticality: High
    text: Information stored on, processed by or accessible via user endpoint devices must be protected.

  - ref: A.8.2
    title: Privileged access rights
    domain: IAM
    uc: UC-IAM-06
    criticality: High
    text: The allocation and use of privileged access rights must be restricted and managed.

  - ref: A.8.3
    title: Information access restriction
    domain: IAM
    uc: UC-IAM-04
    criticality: High
    text: Access to information and other associated assets must be restricted in accordance with the established topic-specific policy on access control.

  - ref: A.8.4
    title: Access to source code
    domain: APP
    uc: UC-APP-04
    criticality: Medium
    text: Read and write access to source code, development tools and software libraries must be appropriately managed.

  - ref: A.8.5
    title: Secure authentication
    domain: IAM
    uc: UC-IAM-03
    criticality: High
    text: Secure authentication technologies and procedures must be implemented based on information access restrictions and the topic-specific policy on access control.

  - ref: A.8.6
    title: Capacity management
    domain: BCR
    uc: UC-BCR-04
    criticality: Medium
    text: The use of resources must be monitored and adjusted in line with current and expected capacity requirements.

  - ref: A.8.7
    title: Protection against malware
    domain: NET
    uc: UC-NET-04
    criticality: High
    text: Protection against malware must be implemented and supported by appropriate user awareness.

  - ref: A.8.8
    title: Management of technical vulnerabilities
    domain: VUL
    uc: UC-VUL-01
    criticality: High
    text: Information about technical vulnerabilities of information systems in use must be obtained, the organization's exposure evaluated, and appropriate measures taken.

  - ref: A.8.9
    title: Configuration management
    domain: CFG
    uc: UC-CFG-01
    criticality: High
    text: Configurations, including security configurations, of hardware, software, services and networks must be established, documented, implemented, monitored and reviewed.

  - ref: A.8.10
    title: Information deletion
    domain: MED
    uc: UC-MED-01
    criticality: High
    text: Information stored in information systems, devices or in any other storage media must be deleted when no longer required.

  - ref: A.8.11
    title: Data masking
    domain: DAT
    uc: UC-DAT-01
    criticality: Medium
    text: Data masking must be used in accordance with the organization's topic-specific policy on access control and other related topic-specific policies, and business requirements, taking applicable legislation into consideration.

  - ref: A.8.12
    title: Data leakage prevention
    domain: DAT
    uc: UC-DAT-05
    criticality: High
    text: Data leakage prevention measures must be applied to systems, networks and any other devices that process, store or transmit sensitive information.

  - ref: A.8.13
    title: Information backup
    domain: BCR
    uc: UC-BCR-02
    criticality: High
    text: Backup copies of information, software and systems must be maintained and regularly tested in accordance with the agreed topic-specific policy on backup.

  - ref: A.8.14
    title: Redundancy of information processing facilities
    domain: BCR
    uc: UC-BCR-04
    criticality: High
    text: Information processing facilities must be implemented with redundancy sufficient to meet availability requirements.

  - ref: A.8.15
    title: Logging
    domain: LOG
    uc: UC-LOG-01
    criticality: High
    text: Logs that record activities, exceptions, faults and other relevant events must be produced, stored, protected and analysed.

  - ref: A.8.16
    title: Monitoring activities
    domain: LOG
    uc: UC-LOG-02
    criticality: High
    text: Networks, systems and applications must be monitored for anomalous behaviour and appropriate actions taken to evaluate potential information security incidents.

  - ref: A.8.17
    title: Clock synchronization
    domain: LOG
    uc: UC-LOG-01
    criticality: Medium
    text: The clocks of information processing systems used by the organization must be synchronized to approved time sources.

  - ref: A.8.18
    title: Use of privileged utility programs
    domain: IAM
    uc: UC-IAM-06
    criticality: Medium
    text: The use of utility programs that can be capable of overriding system and application controls must be restricted and tightly controlled.

  - ref: A.8.19
    title: Installation of software on operational systems
    domain: CFG
    uc: UC-CFG-01
    criticality: Medium
    text: Procedures and measures must be implemented to securely manage software installation on operational systems.

  - ref: A.8.20
    title: Networks security
    domain: NET
    uc: UC-NET-02
    criticality: High
    text: Networks and network devices must be secured, managed and controlled to protect information in systems and applications.

  - ref: A.8.21
    title: Security of network services
    domain: NET
    uc: UC-NET-02
    criticality: Medium
    text: Security mechanisms, service levels and service requirements of network services must be identified, implemented and monitored.

  - ref: A.8.22
    title: Segregation of networks
    domain: NET
    uc: UC-NET-01
    criticality: High
    text: Groups of information services, users and information systems must be segregated in the organization's networks.

  - ref: A.8.23
    title: Web filtering
    domain: NET
    uc: UC-NET-04
    criticality: Low
    text: Access to external websites must be managed to reduce exposure to malicious content.

  - ref: A.8.24
    title: Use of cryptography
    domain: DAT
    uc: UC-DAT-04
    criticality: High
    text: Rules for the effective use of cryptography, including cryptographic key management, must be defined and implemented.

  - ref: A.8.25
    title: Secure development life cycle
    domain: APP
    uc: UC-APP-01
    criticality: High
    text: Rules for the secure development of software and systems must be established and applied.

  - ref: A.8.26
    title: Application security requirements
    domain: APP
    uc: UC-APP-01
    criticality: High
    text: Information security requirements must be identified, specified and approved when developing or acquiring applications.

  - ref: A.8.27
    title: Secure system architecture and engineering principles
    domain: APP
    uc: UC-APP-01
    criticality: Medium
    text: Principles for engineering secure systems must be established, documented, maintained and applied to any information system development activities.

  - ref: A.8.28
    title: Secure coding
    domain: APP
    uc: UC-APP-01
    criticality: High
    text: Secure coding principles must be applied to software development.

  - ref: A.8.29
    title: Security testing in development and acceptance
    domain: APP
    uc: UC-APP-02
    criticality: High
    text: Security testing processes must be defined and implemented in the development life cycle.

  - ref: A.8.30
    title: Outsourced development
    domain: TPR
    uc: UC-TPR-03
    criticality: Medium
    text: The organization must direct, monitor and review the activities related to outsourced system development.

  - ref: A.8.31
    title: Separation of development, test and production environments
    domain: CFG
    uc: UC-APP-01
    criticality: High
    text: Development, testing and production environments must be separated and secured.

  - ref: A.8.32
    title: Change management
    domain: CFG
    uc: UC-CFG-02
    criticality: High
    text: Changes to information processing facilities and information systems must be subject to change management procedures.

  - ref: A.8.33
    title: Test information
    domain: DAT
    uc: UC-DAT-01
    criticality: Medium
    text: Test information must be appropriately selected, protected and managed.

  - ref: A.8.34
    title: Protection of information systems during audit testing
    domain: GOV
    uc: UC-GOV-05
    criticality: Low
    text: Audit tests and other assurance activities involving assessment of operational systems must be planned and agreed between the tester and appropriate management.
